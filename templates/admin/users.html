{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
    <div class="card">
        <h1>Users</h1>
        <ul>
            {% for user in users %}
                <li>
                    {{ user.username }} - {{ user.email }}
                    <form action="{{ url_for('suspend_user', id=user.id) }}" method="post" style="display:inline;">
                        <button type="submit" class="btn">Suspend</button>
                    </form>
                    <form action="{{ url_for('remove_user', id=user.id) }}" method="post" style="display:inline;">
                        <button type="submit" class="btn">Remove</button>
                    </form>
                    <a href="{{ url_for('user_logs', id=user.id) }}" class="btn">View Logs</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
