{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
    <div class="card">
        <h1>Welcome to Pipis Class Resources site</h1>
        <p>Find resources for your classes here.</p>
        <ul>
            {% for course in courses %}
                <li>
                    <a href="{{ url_for('course_detail', id=course.id) }}">{{ course.title }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
